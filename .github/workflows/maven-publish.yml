name: CI Workflow

on:
  push:
    branches:
      - 'master'
      - 'main'
  pull_request:
    branches:    
      - 'master'
      - 'main'
  workflow_dispatch:
    branches:
      - '**'

env:
  SHOULD_DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
  RESOURCE_GROUP_NAME: 'kyleburnsdev-springboot'
  RESOURCE_GROUP_LOCATION: 'eastus'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Build App with Maven
      run: mvn clean package --file pom.xml

    - name: Install Bicep
      run: |
        curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
        chmod +x ./bicep
        sudo mv ./bicep /usr/local/bin/bicep
        bicep --help

    - name: Generate ARM template
      run: |
        mkdir -p target/bicep
        bicep build src/main/az/main.bicep --outdir target/bicep

    - name: Publish App Artifact
      uses: actions/upload-artifact@v2
      with:
        name: app
        path: ./target/app.jar

    - name: Publish Infra Artifact
      uses: actions/upload-artifact@v2
      with:
        name: infra
        path: ./target/bicep/main.json

  dev:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: build
    uses: ./.github/workflows/deploy-to-environment.yml
    with:
      resource-group-base-name: 'my-sb-app'
      environment-suffix: 'dev'
      resource-group-location: 'eastus2'
    secrets:
      azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}

  test:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: dev
    uses: ./.github/workflows/deploy-to-environment.yml
    with:
      resource-group-base-name: 'my-sb-app'
      environment-suffix: 'test'
      resource-group-location: 'eastus2'
    secrets:
      azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}

  qa:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: test
    uses: ./.github/workflows/deploy-to-environment.yml
    with:
      resource-group-base-name: 'my-sb-app'
      environment-suffix: 'qa'
      resource-group-location: 'eastus2'
    secrets:
      azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}



