name: CI Workflow

on:
  push:
    branches:
      - 'master'
      - 'main'
  pull_request:
    branches:    
      - 'master'
      - 'main'
  workflow_dispatch:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      SHOULD_DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      RESOURCE_GROUP_NAME: 'kyleburnsdev-springboot'
      RESOURCE_GROUP_LOCATION: 'eastus'

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Build App with Maven
      run: mvn clean package --file pom.xml

    - name: Install Bicep
      run: |
        curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
        chmod +x ./bicep
        sudo mv ./bicep /usr/local/bin/bicep
        bicep --help

    - name: Generate ARM template
      run: |
        mkdir -p target/bicep
        bicep build src/main/az/main.bicep --outdir target/bicep

    - name: Establish AZ connection
      if: ${{ env.SHOULD_DEPLOY == 'true' }}
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Ensure Resource Group Exists
      if: ${{ env.SHOULD_DEPLOY == 'true' }}
      uses: Azure/CLI@v1
      with:
        inlineScript: |
          #!/bin/bash
          az group create --name ${{ env.RESOURCE_GROUP_NAME }} --location ${{ env.RESOURCE_GROUP_LOCATION }}

    - name: Infra
      id: Infra
      if: ${{ env.SHOULD_DEPLOY == 'true' }}
      uses: azure/arm-deploy@v1
      with:
        resourceGroupName: ${{ env.RESOURCE_GROUP_NAME }}
        template: ./target/bicep/main.json

    - name: App
      if: ${{ env.SHOULD_DEPLOY == 'true' }}
      uses: Azure/CLI@v1
      with:
        inlineScript: |
          #!/bin/bash
          az webapp deploy --resource-group ${{ env.RESOURCE_GROUP_NAME }} --name ${{ steps.Infra.outputs.websiteName }} --src-path ./target/app.jar

