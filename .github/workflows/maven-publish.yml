name: CI Workflow

on:
  push:
    branches:
      - 'master'
      - 'main'
  pull_request:
    branches:    
      - 'master'
      - 'main'
  workflow_dispatch:
    branches:
      - '**'

env:
  SHOULD_DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
  RESOURCE_GROUP_NAME: 'kyleburnsdev-springboot'
  RESOURCE_GROUP_LOCATION: 'eastus'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Build App with Maven
      run: mvn clean package --file pom.xml

    - name: Install Bicep
      run: |
        curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
        chmod +x ./bicep
        sudo mv ./bicep /usr/local/bin/bicep
        bicep --help

    - name: Generate ARM template
      run: |
        mkdir -p target/bicep
        bicep build src/main/az/main.bicep --outdir target/bicep

    - name: Publish App Artifact
      uses: actions/upload-artifact@v2
      with:
        name: app
        path: ./target/app.jar

    - name: Publish Infra Artifact
      uses: actions/upload-artifact@v2
      with:
        name: infra
        path: ./target/bicep/main.json

  deploy_poc:
    needs: build
    uses: ./.github/workflows/deploy-to-environment.yml
    with:
      resource-group-base-name: 'my-sb-app'
      environment-suffix: 'poc'
      resource-group-location: 'eastus2'
    secrets:
      azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}

  deploy_dev:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write

    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v2

    - name: Establish AZ connection
      if: ${{ env.SHOULD_DEPLOY == 'true' }}
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Ensure Resource Group Exists
      if: ${{ env.SHOULD_DEPLOY == 'true' }}
      uses: Azure/CLI@v1
      with:
        inlineScript: |
          #!/bin/bash
          az group create --name ${{ env.RESOURCE_GROUP_NAME }} --location ${{ env.RESOURCE_GROUP_LOCATION }}

    - name: Infra
      id: Infra
      if: ${{ env.SHOULD_DEPLOY == 'true' }}
      uses: azure/arm-deploy@v1
      with:
        resourceGroupName: ${{ env.RESOURCE_GROUP_NAME }}
        template: ./infra/main.json

    - name: App
      if: ${{ env.SHOULD_DEPLOY == 'true' }}
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ steps.Infra.outputs.websiteName }}
        package: ./app/app.jar

    - name: Generate Temporary API Key For App Insights
      id: AIKeyGen
      if: ${{ env.SHOULD_DEPLOY == 'true' }}
      uses: Azure/CLI@v1
      with:
        inlineScript: |
          az config set extension.use_dynamic_install=yes_without_prompt
          result=$(az monitor app-insights api-key create \
                      --api-key ${{ steps.Infra.outputs.releaseAnnotationId }} \
                      --write-properties WriteAnnotations \
                      -g ${{ env.RESOURCE_GROUP_NAME }} \
                      --app ${{ steps.Infra.outputs.applicationInsightsApplicationId }} \
                      --query "apiKey" --output tsv)
          echo "::set-output name=aiKey::$result"
    
    - name: Consume AI Key For App Insights
      if: ${{ env.SHOULD_DEPLOY == 'true' }}
      run: |
        echo ${{ steps.AIKeyGen.outputs.aiKey }}

    - name: Annotate deployment
      if: ${{ env.SHOULD_DEPLOY == 'true' }}
      uses: wictorwilen/application-insights-action@v1
      id: annotation
      with:
        applicationId: ${{ steps.Infra.outputs.applicationInsightsApiAppId }}
        apiKey: ${{ steps.AIKeyGen.outputs.aiKey }}
        releaseName: ${{ github.event_name }}
        message: ${{ github.event.head_commit.message }}
        actor: ${{ github.actor }}

    - name: Remove Temporary API Key For App Insights
      if: ${{ env.SHOULD_DEPLOY == 'true' }}
      uses: Azure/CLI@v1
      with:
        inlineScript: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az monitor app-insights api-key delete \
                      --api-key ${{ steps.Infra.outputs.releaseAnnotationId }} \
                      -g ${{ env.RESOURCE_GROUP_NAME }} \
                      --app ${{ steps.Infra.outputs.applicationInsightsApplicationId }} 



